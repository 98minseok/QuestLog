spring:
  profiles:
    default: local
  datasource:
    url: jdbc:postgresql://localhost:5434/questlog
    username: questlog
    password: questlog
    driver-class-name: org.postgresql.Driver
  application:
    name: quest-log-be

server:
  port: 8081

questlog:
  recommendations:
    provider: deterministic
    external:
      endpoint: ${QUESTLOG_RECOMMENDATIONS_EXTERNAL_ENDPOINT:}
      api-key: ${QUESTLOG_RECOMMENDATIONS_EXTERNAL_API_KEY:}
      provider-id: ${QUESTLOG_RECOMMENDATIONS_EXTERNAL_PROVIDER_ID:external-http}
      max-drafts: ${QUESTLOG_RECOMMENDATIONS_EXTERNAL_MAX_DRAFTS:3}
